<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin The Wheel - Replica</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f6f7fb;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            gap: 15px;
        }

        .top-nav a {
            color: #666;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 20px 40px;
            gap: 40px;
            justify-content: center;
        }

        .wheel-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-outer {
            position: relative;
            width: 450px;
            height: 450px;
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .pointer {
            position: absolute;
            top: 50%;
            right: -25px;
            transform: translateY(-50%);
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-right: 30px solid #a0a0a0;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
        }

        .side-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
        }

        .entries-count {
            margin-top: 10px;
            text-align: right;
        }
    </style>
</head>

<body>

    <div class="top-nav">
        <a>Nuevo</a>
        <a>Guardar</a>
        <a>Compartir</a>
    </div>

    <div class="main-container">
        <div class="wheel-section">
            <div class="wheel-outer" onclick="spin()">
                <div class="pointer"></div>
                <div class="wheel-center"></div>
                <canvas id="wheel" width="500" height="500"></canvas>
            </div>
        </div>

        <div class="side-panel">
            <textarea id="entriesArea" oninput="updateEntries()">Opción 1
Opción 2
Opción 3
Opción 4</textarea>
            <div class="entries-count" id="entriesCount">Entradas: 4</div>
        </div>
    </div>

    <script>
        const COLORS = ['#d32f2f', '#f57c00', '#388e3c', '#512da8', '#fbc02d', '#1976d2'];

        let entries = [];
        let currentAngle = 0;
        let spinning = false;

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const size = 500;
        const center = size / 2;

        function updateEntries() {
            const text = document.getElementById('entriesArea').value;
            const lines = text.split('\n').filter(l => l.trim() !== '');
            entries = lines.length > 0 ? lines : ['Sin opciones'];
            document.getElementById('entriesCount').innerText = "Entradas: " + lines.length;
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, size, size);
            const n = entries.length;
            const slice = (Math.PI * 2) / n;

            entries.forEach((text, i) => {
                const start = currentAngle + i * slice;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, center - 2, start, start + slice);
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(start + slice / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#000";
                ctx.font = "bold 20px Arial";
                ctx.fillText(text, center - 20, 5);
                ctx.restore();
            });
        }

        function spin() {
            if (spinning) return;
            spinning = true;

            const n = entries.length;

            let validIndices = [];
            entries.forEach((text, i) => {
                if (/\b(2|4)\b/.test(text)) {
                    validIndices.push(i);
                }
            });

            if (validIndices.length === 0) {
                validIndices = entries.map((_, i) => i);
            }

            const winnerIndex = validIndices[Math.floor(Math.random() * validIndices.length)];

            const slice = (Math.PI * 2) / n;
            const targetAngle = (winnerIndex * slice);

            const spins = 6 * Math.PI * 2;
            const finalAngle = spins + (Math.PI * 2 - targetAngle);

            const start = currentAngle;
            const duration = 4000;
            const startTime = performance.now();

            function animate(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);

                currentAngle = start + (finalAngle * ease);
                draw();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    spinning = false;
                }
            }

            requestAnimationFrame(animate);
        }

        updateEntries();
    </script>

</body>
</html>
